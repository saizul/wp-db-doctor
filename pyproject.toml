[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-db-doctor"
version = "0.1.0"
description = "Audit a WordPress MySQL/MariaDB database for bloat and problems, and generate reviewed cleanup SQL."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["wordpress", "mysql", "mariadb", "database", "woocommerce", "performance", "cleanup", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyMySQL>=1.0",
    # tomllib joined the standard library in 3.11.
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/saizul/wp-db-doctor"
Issues = "https://github.com/saizul/wp-db-doctor/issues"
Changelog = "https://github.com/saizul/wp-db-doctor/blob/main/CHANGELOG.md"

[project.scripts]
wp-db-doctor = "wp_db_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
